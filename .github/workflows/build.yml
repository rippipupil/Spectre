name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versión
        shell: pwsh
        run: |
          # Una sola versión para el exe, el instalador y la etiqueta de la
          # release: "Buscar actualizaciones" compara la del exe con la etiqueta.
          $version = "0.1.$env:GITHUB_RUN_NUMBER"
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $version = $env:GITHUB_REF_NAME.Substring(1) }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Versión: $version"

      - name: Descargar FFmpeg (LGPL, shared)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Rama fija 8.1: BtbN compila la 8.0 y la 8.1 con las cabeceras de
          # NVENC 13.0 (driver NVIDIA 570 o más) y la 8.2 en adelante con las
          # 13.1 (driver 610 o más). Con la 9.0, las GTX 900/1000, que se
          # quedan en la rama de drivers R580, no podían abrir NVENC y Spectre
          # acababa codificando por CPU, que es justo lo que da lag en el
          # juego. Si BtbN deja de publicar la 8.1, la CI falla aquí a
          # propósito: hay que elegir otra rama mirando qué driver exige.
          $branch = '8.1'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN" }
          $release = Invoke-RestMethod -Headers $headers https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest
          $asset = $release.assets |
            Where-Object { $_.name -match "^ffmpeg-n$([regex]::Escape($branch))-latest-win64-lgpl-shared-.*\.zip$" } |
            Select-Object -First 1
          if (-not $asset) { throw "BtbN ya no publica FFmpeg $branch (LGPL, shared): elegir otra rama en build.yml" }
          Write-Host "FFmpeg: $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          $dir = Get-ChildItem ffmpeg-tmp | Select-Object -First 1
          Move-Item $dir.FullName ffmpeg
          Get-ChildItem ffmpeg/lib | Select-Object Name
          Get-ChildItem ffmpeg/bin | Select-Object Name

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configurar
        # Entre comillas: PowerShell parte en el primer punto los argumentos que
        # empiezan por "-" y CMake recibía la versión "0".
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DSPECTRE_FFMPEG_DIR=${{ github.workspace }}/ffmpeg" "-DSPECTRE_BUILD_VERSION=${{ env.APP_VERSION }}"

      - name: Compilar
        run: cmake --build build

      - name: Empaquetar
        shell: pwsh
        run: cmake --install build --prefix dist

      - name: Comprobar dependencias del exe
        shell: pwsh
        run: |
          # El exe usa CRT estático: no debe necesitar el redistribuible de VC++.
          $deps = dumpbin /dependents dist\spectre.exe | Out-String
          Write-Host $deps
          if ($deps -match '(?i)(vcruntime|msvcp)\d*\.dll') { throw "spectre.exe depende del runtime de VC++" }
          foreach ($dll in 'avcodec','avfilter','avformat','avutil','swresample','swscale') {
            if (-not (Get-ChildItem dist -Filter "$dll-*.dll")) { throw "Falta $dll en dist" }
          }

      - name: Comprobar los filtros del editor
        shell: pwsh
        run: |
          # «Editar» (src/app/VideoEdit.cpp) monta sus grafos con estos filtros:
          # la build LGPL de FFmpeg tiene que traerlos todos (boxblur y eq son
          # GPL y no se usan).
          $list = & ffmpeg\bin\ffmpeg.exe -hide_banner -filters | Out-String
          $names = @('buffer','buffersink','abuffer','abuffersink','format','transpose','hflip','vflip','crop',
                     'split','scale','gblur','lutyuv','overlay','pad','unsharp','vignette','fade','palettegen',
                     'paletteuse','atrim','asetpts','aresample','atempo','areverse','aformat','volume','afftdn',
                     'amix','dynaudnorm','afade','alimiter')
          foreach ($f in $names) {
            if ($list -notmatch "(?m)^\s*\S{2,3}\s+$f\s") { throw "La build de FFmpeg no tiene el filtro $f" }
          }
          Write-Host "Filtros del editor: los $($names.Count) están"

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=$env:APP_VERSION /DSourceDir=..\dist installer\spectre.iss
          Compress-Archive dist\* installer\output\Spectre-Portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: spectre-portable-x64
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: spectre-instalador
          path: installer/output/*.exe

      - name: Publicar release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Cada cambio en main (o etiqueta vX.Y.Z) publica una release con
          # enlace directo a Spectre-Setup.exe.
          $tag = "v$env:APP_VERSION"
          gh release create $tag installer/output/Spectre-Setup.exe installer/output/Spectre-Portable.zip `
            --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Spectre $tag" --latest `
            --notes "Descarga **Spectre-Setup.exe** y ábrelo. Incluye todo lo necesario y no pide permisos de administrador. Si ya tienes Spectre, se actualiza conservando tus ajustes. Atajos: Alt+Z abre el panel, Alt+F10 guarda un clip y Alt+F9 empieza o detiene una grabación."
